name: boda-jans-yurleydi

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: boda-jans-yurleydi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: boda_jans
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.production}
      POSTGRES_DB: boda_jans
    volumes:
      - boda_jans_yurleydi_pgdata:/var/lib/postgresql/data
    networks:
      - boda-jans-yurleydi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boda_jans -d boda_jans"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boda-jans-yurleydi-app
    restart: unless-stopped
    init: true
    env_file:
      - path: .env.production
        required: true
    environment:
      DATABASE_URL: postgresql://boda_jans:${DB_PASSWORD}@db:5432/boda_jans?schema=public
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: boda_jans
      DB_NAME: boda_jans
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3004}:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - boda-jans-yurleydi-network
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  boda_jans_yurleydi_pgdata:

networks:
  boda-jans-yurleydi-network:
    driver: bridge
